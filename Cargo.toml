[workspace]
resolver = "2"
members = [
    "crates/splitter",
    "crates/splitype_installer",
    "crates/splitype_cli",
    "crates/markdown_parser",
    "crates/syntax_highlighter",
    "crates/theme",
    "crates/config",
    "crates/ui",
    "crates/window",
    "crates/core_contracts",
    "crates/editor",
    "crates/pane_source_code",
    "crates/pane_wysiwyg",
    "crates/pane_preview",
    "crates/settings",
    "crates/explorer",
    "crates/app",
    "xtask",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/hengvvang/splitype"
license = "GPL-3.0-or-later"
rust-version = "1.91"

[workspace.dependencies]
# Member crates
core_contracts = { path = "crates/core_contracts" }
markdown_parser = { path = "crates/markdown_parser" }
syntax_highlighter = { path = "crates/syntax_highlighter" }
splitter = { path = "crates/splitter" }
splitype_installer = { path = "crates/splitype_installer" }
splitype_cli = { path = "crates/splitype_cli" }
theme = { path = "crates/theme" }
config = { path = "crates/config" }
ui = { path = "crates/ui" }
window = { path = "crates/window" }
editor = { path = "crates/editor" }
pane_source_code = { path = "crates/pane_source_code" }
pane_wysiwyg = { path = "crates/pane_wysiwyg" }
pane_preview = { path = "crates/pane_preview" }
settings = { path = "crates/settings" }
explorer = { path = "crates/explorer" }
app = { path = "crates/app" }

# Third-party shared dependencies
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git" }
uuid = { version = "1.23", features = ["v4", "serde"] }
cssparser = "0.37"
tree-sitter = "0.26.9"
tree-sitter-html = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[workspace.lints.rust]
unused_must_use = "deny"
keyword_idents_2024 = "deny"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
if_same_then_else = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
let_underscore_future = "allow"
manual_div_ceil = "allow"
manual_checked_ops = "allow"
manual_clamp = "allow"
module_inception = "allow"
obfuscated_if_else = "allow"
question_mark = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"

[profile.bench]
debug = true

[profile.test]
debug = 0
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
taffy = { opt-level = 3 }
async-task = { opt-level = 3 }
parking_lot = { opt-level = 3 }
parking_lot_core = { opt-level = 3 }
hashbrown = { opt-level = 3 }
smallvec = { opt-level = 3 }
lyon = { opt-level = 3 }
lyon_geom = { opt-level = 3 }
lyon_path = { opt-level = 3 }
lyon_tessellation = { opt-level = 3 }
etagere = { opt-level = 3 }
image = { opt-level = 3 }
serde = { opt-level = 3 }
serde_json = { opt-level = 3 }

[profile.test.package]
gpui = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
taffy = { opt-level = 3 }
async-task = { opt-level = 3 }
parking_lot = { opt-level = 3 }
parking_lot_core = { opt-level = 3 }
hashbrown = { opt-level = 3 }
smallvec = { opt-level = 3 }
lyon = { opt-level = 3 }
lyon_geom = { opt-level = 3 }
lyon_path = { opt-level = 3 }
lyon_tessellation = { opt-level = 3 }
etagere = { opt-level = 3 }
image = { opt-level = 3 }
serde = { opt-level = 3 }
serde_json = { opt-level = 3 }
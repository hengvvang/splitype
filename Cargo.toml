[workspace]
resolver = "2"
members = [
    "crates/primitives",
    "crates/sum_tree",
    "crates/markdown",
    "crates/splitter",
    "crates/theme",
    "crates/i18n",
    "crates/config",
    "crates/net",
    "crates/syntax",
    "crates/latex",
    "crates/mermaid",
    "crates/export",
    "crates/ui",
    "crates/explorer_fs",
    "crates/workspace",
    "crates/editor",
    "crates/editor_source_code",
    "crates/settings",
    "crates/explorer",
    "crates/splitype",
    "xtask",
]
default-members = ["crates/splitype"]

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/hengvvang/splitype"
license = "GPL-3.0-or-later"
rust-version = "1.91"

[workspace.dependencies]
# Member crates
primitives = { path = "crates/primitives" }
sum_tree = { path = "crates/sum_tree" }
markdown = { path = "crates/markdown" }
splitter = { path = "crates/splitter" }
theme = { path = "crates/theme" }
i18n = { path = "crates/i18n" }
config = { path = "crates/config" }
net = { path = "crates/net" }
syntax = { path = "crates/syntax" }
latex = { path = "crates/latex" }
mermaid = { path = "crates/mermaid" }
export = { path = "crates/export" }
ui = { path = "crates/ui" }
explorer_fs = { path = "crates/explorer_fs" }
workspace = { path = "crates/workspace" }
editor = { path = "crates/editor" }
editor_source_code = { path = "crates/editor_source_code" }
settings = { path = "crates/settings" }
explorer = { path = "crates/explorer" }
splitype = { path = "crates/splitype" }

# Third-party shared dependencies
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git" }
uuid = { version = "1.23", features = ["v4"] }
cssparser = "0.37"
tree-sitter = "0.26.9"
tree-sitter-html = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[workspace.lints.rust]
unused_must_use = "deny"
keyword_idents_2024 = "deny"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
if_same_then_else = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
let_underscore_future = "allow"
manual_div_ceil = "allow"
manual_checked_ops = "allow"
manual_clamp = "allow"
module_inception = "allow"
obfuscated_if_else = "allow"
question_mark = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"

[profile.bench]
debug = true

[profile.test]
debug = 0
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
taffy = { opt-level = 3 }
async-task = { opt-level = 3 }
parking_lot = { opt-level = 3 }
parking_lot_core = { opt-level = 3 }
hashbrown = { opt-level = 3 }
smallvec = { opt-level = 3 }
lyon = { opt-level = 3 }
lyon_geom = { opt-level = 3 }
lyon_path = { opt-level = 3 }
lyon_tessellation = { opt-level = 3 }
etagere = { opt-level = 3 }
image = { opt-level = 3 }
serde = { opt-level = 3 }
serde_json = { opt-level = 3 }

[profile.test.package]
gpui = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
taffy = { opt-level = 3 }
async-task = { opt-level = 3 }
parking_lot = { opt-level = 3 }
parking_lot_core = { opt-level = 3 }
hashbrown = { opt-level = 3 }
smallvec = { opt-level = 3 }
lyon = { opt-level = 3 }
lyon_geom = { opt-level = 3 }
lyon_path = { opt-level = 3 }
lyon_tessellation = { opt-level = 3 }
etagere = { opt-level = 3 }
image = { opt-level = 3 }
serde = { opt-level = 3 }
serde_json = { opt-level = 3 }

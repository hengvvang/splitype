name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-platform matrix checking formatting, compilation, and clippy
  check-and-test:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang libssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxdamage-dev libxfixes-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Direct delegation to the project's task runner
      - name: Run code quality checks
        run: cargo xtask check

      - name: Run test suite
        run: cargo xtask test

  # Supply-chain and security audit (runs fast on Ubuntu)
  audit:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-machete
      - uses: taiki-e/install-action@cargo-deny

      - name: Run security & license audit (strict mode)
        run: cargo xtask audit --strict

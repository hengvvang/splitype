# Splitype core application plugin manifest: windows, files, preferences,
# and help commands shared by every window.
manifest_version = 1
plugin = "splitype.core"
name = "Splitype Core"
version = "0.1.0"
description = "Application window, file, preference, and help commands."

[entry]
kind = "in_process"
registration = "core"

[[commands]]
id = "about"
menu = "app"
shortcuts = []

[[commands]]
id = "check-updates"
menu = "app"
shortcuts = []

[[commands]]
id = "open-settings"
menu = "app"
shortcuts = []

[[commands]]
id = "quit"
menu = "app"
shortcuts = ["cmd-q"]

[[commands]]
id = "new-window"
menu = "file"
shortcuts = ["cmd-n", "ctrl-n"]

[[commands]]
id = "close-window"
menu = "file"
shortcuts = ["cmd-w", "ctrl-q"]

[[commands]]
id = "open-file"
menu = "file"
shortcuts = ["cmd-o", "ctrl-o"]

[[commands]]
id = "close-explorer-folder"
menu = "file"
shortcuts = []

[[commands]]
id = "toggle-explorer"
shortcuts = ["ctrl-w"]

[[commands]]
id = "toggle-maximize-area"
shortcuts = ["ctrl-space", "cmd-space"]

[[commands]]
id = "dismiss-transient-ui"
shortcuts = ["escape"]

[[commands]]
id = "copy"
shortcuts = ["cmd-c", "ctrl-c"]
context = "BlockEditor"

[[commands]]
id = "cut"
shortcuts = ["cmd-x", "ctrl-x"]
context = "BlockEditor"

[[commands]]
id = "paste"
shortcuts = ["cmd-v", "ctrl-v"]
context = "BlockEditor"

[[commands]]
id = "undo"
shortcuts = ["cmd-z", "ctrl-z"]
context = "BlockEditor"

[[commands]]
id = "redo"
shortcuts = ["cmd-shift-z", "ctrl-y"]
context = "BlockEditor"

[[commands]]
id = "repository"
menu = "help"
shortcuts = []

[[commands]]
id = "bug-report"
menu = "help"
shortcuts = []

[[commands]]
id = "feature-request"
menu = "help"
shortcuts = []

[[commands]]
id = "discussions"
menu = "help"
shortcuts = []

[[commands]]
id = "install-cli"
menu = "help"
shortcuts = []

[[commands]]
id = "uninstall-cli"
menu = "help"
shortcuts = []

[[settings]]
key = "startup.open"
kind = "enum"
default = "new_file"
title = "App Startup Behavior"
description = "Initial document or workspace opened upon launching Splitype"

[[settings.options]]
value = "new_file"
label = "Open New Document"

[[settings.options]]
value = "last_opened_file"
label = "Open Last Active Document"

[[settings]]
key = "startup.restore_window_state"
kind = "bool"
default = true
title = "Restore Window Geometry & State"
description = "Remember previous window dimensions, position, and layout splits on startup"

[[settings]]
key = "theme.appearance"
kind = "enum"
default = "dark"
title = "Theme Appearance"
description = "Light or dark appearance of the selected theme"

[[settings.options]]
value = "dark"
label = "Dark"

[[settings.options]]
value = "light"
label = "Light"

[[settings.options]]
value = "auto"
label = "Follow System"

[[settings]]
key = "theme.family"
kind = "theme"
default = "splitype"
title = "Theme Family"
description = "Select the application-wide visual theme"

[[settings]]
key = "interface.language_id"
kind = "language"
default = "en-US"
title = "Display Language"
description = "Select preferred language for editor UI and dialogs"

[[settings]]
key = "typography.ui_font_family"
kind = "font"
default = ""
title = "Interface Font"
description = "Font used for menus, file navigation panel, and application chrome"

[[settings]]
key = "typography.prose_font_family"
kind = "font"
default = ""
title = "Prose Text Font"
description = "Font used for Markdown prose, headings, and tables"

[[settings]]
key = "typography.code_font_family"
kind = "font"
default = ""
title = "Code Block Font"
description = "Monospace font used for code blocks and inline code"

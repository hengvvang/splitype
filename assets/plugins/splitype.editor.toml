# Splitype Editor panel plugin manifest.
manifest_version = 1
plugin = "splitype.editor"
name = "Editor"
version = "0.1.0"
description = "Document tab management, pane hosting, and Markdown workflows."

[entry]
kind = "in_process"
registration = "editor"

[capabilities]
panes = []
panels = ["splitype.panel.editor"]

[resources]
icon_root = "icons/editor"

[[commands]]
id = "save"
menu = "file"
shortcut = "ctrl+s"

[[commands]]
id = "save-as"
menu = "file"
shortcut = "ctrl+shift+s"

[[commands]]
id = "export-html"
menu = "file.export"
shortcut = ""

[[commands]]
id = "export-pdf"
menu = "file.export"
shortcut = ""

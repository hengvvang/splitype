[alias]
# Canonical automation entrypoint enabling `cargo xtask <subcommand>`
xtask = "run --package xtask --"
x = "xtask"

# Everyday development shortcuts
c = "check --workspace --all-targets"
t = "test --workspace"
l = "clippy --workspace --all-targets -- -D warnings"
fix = "clippy --fix --allow-dirty --allow-staged --workspace --all-targets"
fmt-check = "fmt --all -- --check"
fmt-fix = "fmt --all"

# Fast testing runner via cargo-nextest
nt = "nextest run"

[env]
# Allocate 64MB default thread stack space for recursive AST parsing and layout passes
RUST_MIN_STACK = "67108864"
CARGO_TERM_COLOR = "always"

# ------------------------------------------------------------------------------
# Universal Compiler Flags
# Configured under `target.'cfg(all())'` rather than `[build]` to guarantee that
# external RUSTFLAGS environment variables (e.g., in CI) merge cumulatively rather
# than silently clobbering these project defaults.
# ------------------------------------------------------------------------------
[target.'cfg(all())']
rustflags = [
    # Enforces v0 symbol mangling for clean closure names and accurate backtraces
    "-C", "symbol-mangling-version=v0",
]

# ------------------------------------------------------------------------------
# Target-Specific Stack and Debuginfo Settings
# ------------------------------------------------------------------------------

# Windows (MSVC): Ensure the main application thread receives the full 64MB stack
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:67108864"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:67108864"]

# macOS: Skip monolithic dSYM generation during iterative local compilation
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "split-debuginfo=unpacked"]

# Linux: Output split DWARF files to prevent high memory usage during linking
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "split-debuginfo=unpacked"]

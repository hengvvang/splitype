[alias]
# Fast type checking across workspace
check-all = "check --workspace --all-targets"

# Strict static analysis / Clippy
lint = "clippy --workspace --all-targets -- -D warnings"
lint-fix = "clippy --fix --allow-dirty --allow-staged --workspace --all-targets"

# Format check / auto-fix
fmt-check = "fmt --all -- --check"
fmt-fix = "fmt --all"

# Faster test runner with expression filters: `cargo t -E 'test(editor::tree)'`
t = "nextest run"
# Unit tests only (skips the four tests/ integration binaries)
tl = "nextest run -E 'package(splitype)'"
# Engine crates in isolation
tm = "nextest run -E 'package(splitype-model)'"
ts = "nextest run -E 'package(splitype-splitter)'"
# Editor subsystem groups (after the editor::tests split)
ted = "nextest run -E 'test(editor::tests)'"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:16777216"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:16777216"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:16777216"]

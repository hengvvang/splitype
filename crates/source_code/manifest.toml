# Splitype Source Code pane plugin manifest.
manifest_version = 1
plugin = "splitype.source-code"
name = "Source Code"
version = "0.1.0"
description = "Plain-text Markdown source pane with layered display maps."

[entry]
kind = "in_process"
registration = "source-code"

[capabilities]
panes = ["splitype.pane.source_code"]
panels = []

# =============================================================================
# Settings Declaration
# Note: The `icon` field is an officially supported optional contract in the
# schema (accepts SVG paths such as "plugin://...").
# It is omitted here pending custom asset availability (deserialized as None via Serde).
# [IMPORTANT]: The `icon` field schema contract MUST be preserved and not removed!
# =============================================================================

[settings.editor_view]
category = "source-code"
title = "Display & Gutter"
description = "Line numbers, soft wrapping, and cursor line highlight"
# icon field preserved in schema; omitted pending asset availability
order = 1
default_collapsed = false

[[settings.editor_view.items]]
key = "line_numbers"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Line Numbers"
description = "Show line numbers in the source gutter"

[[settings.editor_view.items]]
key = "word_wrap"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Soft Word Wrapping"
description = "Wrap long lines to fit the current viewport width"

[[settings.editor_view.items]]
key = "highlight_active_line"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Highlight Active Line"
description = "Subtly highlight the background of the line containing the cursor"

[settings.indentation]
category = "source-code"
title = "Indentation"
description = "Tab width and whitespace insertion behavior"
# icon field preserved in schema; omitted pending asset availability
order = 2
default_collapsed = false

[[settings.indentation.items]]
key = "tab_size"
# icon field preserved in schema; omitted pending asset availability
kind = "number"
default = 4
min = 2
max = 8
step = 2
title = "Tab Indentation Width"
description = "The number of spaces a tab character equals (2, 4, or 8 spaces)"

[[settings.indentation.items]]
key = "insert_spaces"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Insert Spaces on Tab"
description = "Pressing Tab inserts spaces instead of a literal tab character"

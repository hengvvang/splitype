[package]
name = "editor_source_code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/source_code.rs"

[features]
default = ["code-highlight-core", "code-highlight-official", "code-highlight-config"]
code-highlight-core = [
    "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-c-sharp", "tree-sitter-css",
    "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript",
    "tree-sitter-json", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-typescript",
    "tree-sitter-yaml",
]
code-highlight-official = [
    "code-highlight-core",
    "tree-sitter-md", "tree-sitter-bash", "tree-sitter-php", "tree-sitter-ruby",
]
code-highlight-config = [
    "code-highlight-core",
    "tree-sitter-toml",
]

[lints]
workspace = true

[dependencies]
gpui = { workspace = true }
editor_model = { path = "../editor_model" }
editor_outline = { path = "../editor_outline" }
editor_search = { path = "../editor_search" }
theme = { path = "../theme" }
tree-sitter = { workspace = true }
tree-sitter-html = { workspace = true, optional = true }
tree-sitter-highlight = "0.26.9"
lazy_static = "1.5"

# Source-code language highlighting (self-hosted, D14-B — independent of
# the WYSIWYG world's highlight implementation).
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-toml = { package = "adot-tree-sitter-toml", version = "0.1", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }

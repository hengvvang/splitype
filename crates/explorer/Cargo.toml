thiserror = { workspace = true }
trash = "5"
tracing = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }


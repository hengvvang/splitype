# Splitype Explorer file-tree panel plugin manifest.
manifest_version = 1
plugin = "splitype.explorer"
name = "Explorer"
version = "0.1.0"
description = "File-tree panel with worktree scanning, selection, and drag-and-drop."

[entry]
kind = "in_process"
registration = "explorer"

[capabilities]
panes = []
panels = ["splitype.panel.explorer"]

# =============================================================================
# Settings Declaration
# Note: The `icon` field is an officially supported optional contract in the
# schema (accepts SVG paths such as "plugin://...").
# It is omitted here pending custom asset availability (deserialized as None via Serde).
# [IMPORTANT]: The `icon` field schema contract MUST be preserved and not removed!
# =============================================================================

[settings.file_tree]
category = "explorer"
title = "File Tree"
description = "File tree scanning, display, and auto-selection settings"
# icon field preserved in schema; omitted pending asset availability
order = 1
default_collapsed = false

[[settings.file_tree.items]]
key = "hide_hidden"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Hide Dotfiles"
description = "Skip dot-prefixed files and folders during tree scans"

[[settings.file_tree.items]]
key = "sort_mode"
# icon field preserved in schema; omitted pending asset availability
kind = "enum"
default = "directories_first"
title = "Sort Mode"
description = "Grouping strategy for the file tree entries"
options = [
  { value = "directories_first", label = "Directories First" },
  { value = "files_first", label = "Files First" },
  { value = "mixed", label = "Mixed (Alphabetical)" },
]

[[settings.file_tree.items]]
key = "sort_order"
# icon field preserved in schema; omitted pending asset availability
kind = "enum"
default = "ascending"
title = "Sort Order"
description = "Ascending or descending entry ordering"
options = [
  { value = "ascending", label = "Ascending (A to Z)" },
  { value = "descending", label = "Descending (Z to A)" },
]

[[settings.file_tree.items]]
key = "auto_reveal"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Auto Reveal Active File"
description = "Reveal and select the active document's file in the tree"

[[theme_tokens]]
key = "splitype.explorer.selection_accent"
description = "Accent bar color of the selected file-tree row"

# =============================================================================
# Commands Contribution Architecture (CommandGroup Tree)
# =============================================================================

[commands.operations]
title = "File Operations"
description = "File and folder manipulation in workspace tree"
context = "ExplorerPanel"

[[commands.operations.items]]
id = "new-file"
title = "New File"
description = "Create a new file in the selected directory"
shortcuts = ["alt-n"]

[[commands.operations.items]]
id = "new-directory"
title = "New Folder"
description = "Create a new folder in the selected directory"
shortcuts = ["alt-shift-n"]

[[commands.operations.items]]
id = "rename"
title = "Rename Entry"
description = "Rename the selected file or directory"
shortcuts = ["f2"]

[[commands.operations.items]]
id = "delete"
title = "Delete Permanently"
description = "Permanently delete the selected file or directory"
shortcuts = ["delete"]

[[commands.operations.items]]
id = "trash"
title = "Move to Trash"
description = "Move the selected file or directory to system trash"

[commands.selection]
title = "Tree Selection"
description = "File tree item navigation and cursor movement"
context = "ExplorerPanel"

[[commands.selection.items]]
id = "select-previous"
title = "Select Previous Entry"
description = "Move tree selection up"
shortcuts = ["up"]

[[commands.selection.items]]
id = "select-next"
title = "Select Next Entry"
description = "Move tree selection down"
shortcuts = ["down"]

[[commands.selection.items]]
id = "select-parent"
title = "Select Parent Folder"
description = "Navigate selection to parent folder"
shortcuts = ["alt-up"]

[[commands.selection.items]]
id = "select-first"
title = "Select First Entry"
description = "Navigate selection to the top of the tree"
shortcuts = ["home"]

[[commands.selection.items]]
id = "select-last"
title = "Select Last Entry"
description = "Navigate selection to the bottom of the tree"
shortcuts = ["end"]

[commands.tree]
title = "Tree Operations"
description = "Tree node expand, collapse, and activation"
context = "ExplorerPanel"

[[commands.tree.items]]
id = "expand-selected"
title = "Expand Selected Folder"
description = "Expand the highlighted folder"
shortcuts = ["right"]

[[commands.tree.items]]
id = "collapse-selected"
title = "Collapse Selected Folder"
description = "Collapse the highlighted folder"
shortcuts = ["left"]

[[commands.tree.items]]
id = "open-selected"
title = "Open Selected Document"
description = "Open the selected document in active editor pane"
shortcuts = ["enter"]

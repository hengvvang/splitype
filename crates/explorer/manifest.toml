# Splitype Explorer file-tree panel plugin manifest.
manifest_version = 1
plugin = "splitype.explorer"
name = "Explorer"
version = "0.1.0"
description = "File-tree panel with worktree scanning, selection, and drag-and-drop."

[entry]
kind = "in_process"
registration = "explorer"

[capabilities]
panes = []
panels = ["splitype.panel.explorer"]

# =============================================================================
# Settings Declaration
# Note: The `icon` field is an officially supported optional contract in the
# schema (accepts SVG paths such as "plugin://...").
# It is omitted here pending custom asset availability (deserialized as None via Serde).
# [IMPORTANT]: The `icon` field schema contract MUST be preserved and not removed!
# =============================================================================

[settings.file_tree]
category = "explorer"
title = "File Tree"
description = "File tree scanning, display, and auto-selection settings"
# icon field preserved in schema; omitted pending asset availability
order = 1
default_collapsed = false

[[settings.file_tree.items]]
key = "hide_hidden"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Hide Dotfiles"
description = "Skip dot-prefixed files and folders during tree scans"

[[settings.file_tree.items]]
key = "sort_mode"
# icon field preserved in schema; omitted pending asset availability
kind = "enum"
default = "directories_first"
title = "Sort Mode"
description = "Grouping strategy for the file tree entries"
options = [
  { value = "directories_first", label = "Directories First" },
  { value = "files_first", label = "Files First" },
  { value = "mixed", label = "Mixed (Alphabetical)" },
]

[[settings.file_tree.items]]
key = "sort_order"
# icon field preserved in schema; omitted pending asset availability
kind = "enum"
default = "ascending"
title = "Sort Order"
description = "Ascending or descending entry ordering"
options = [
  { value = "ascending", label = "Ascending (A to Z)" },
  { value = "descending", label = "Descending (Z to A)" },
]

[[settings.file_tree.items]]
key = "auto_reveal"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Auto Reveal Active File"
description = "Reveal and select the active document's file in the tree"

[[theme_tokens]]
key = "splitype.explorer.selection_accent"
description = "Accent bar color of the selected file-tree row"

[[commands]]
id = "rename"
shortcuts = ["f2"]
context = "ExplorerPanel"

[[commands]]
id = "delete"
shortcuts = ["delete"]
context = "ExplorerPanel"

[[commands]]
id = "trash"
shortcuts = []
context = "ExplorerPanel"

[[commands]]
id = "new-file"
shortcuts = ["alt-n"]
context = "ExplorerPanel"

[[commands]]
id = "new-directory"
shortcuts = ["alt-shift-n"]
context = "ExplorerPanel"

[[commands]]
id = "select-previous"
shortcuts = ["up"]
context = "ExplorerPanel"

[[commands]]
id = "select-next"
shortcuts = ["down"]
context = "ExplorerPanel"

[[commands]]
id = "select-parent"
shortcuts = ["alt-up"]
context = "ExplorerPanel"

[[commands]]
id = "select-first"
shortcuts = ["home"]
context = "ExplorerPanel"

[[commands]]
id = "select-last"
shortcuts = ["end"]
context = "ExplorerPanel"

[[commands]]
id = "expand-selected"
shortcuts = ["right"]
context = "ExplorerPanel"

[[commands]]
id = "collapse-selected"
shortcuts = ["left"]
context = "ExplorerPanel"

[[commands]]
id = "open-selected"
shortcuts = ["enter"]
context = "ExplorerPanel"

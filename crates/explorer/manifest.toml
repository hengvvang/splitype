# Splitype Explorer file-tree panel plugin manifest.
manifest_version = 1
plugin = "splitype.explorer"
name = "Explorer"
version = "0.1.0"
description = "File-tree panel with worktree scanning, selection, and drag-and-drop."

[entry]
kind = "in_process"
registration = "explorer"

[capabilities]
panes = []
panels = ["splitype.panel.explorer"]

[[settings]]
key = "hide_hidden"
kind = "bool"
default = true
title = "Hide Dotfiles"
description = "Skip dot-prefixed files and folders during tree scans"

[[settings]]
key = "sort_mode"
kind = "enum"
default = "directories_first"
title = "Sort Mode"
description = "Grouping strategy for the file tree entries"

[[settings.options]]
value = "directories_first"
label = "Directories First"

[[settings.options]]
value = "files_first"
label = "Files First"

[[settings.options]]
value = "mixed"
label = "Mixed (Alphabetical)"

[[settings]]
key = "sort_order"
kind = "enum"
default = "ascending"
title = "Sort Order"
description = "Ascending or descending entry ordering"

[[settings.options]]
value = "ascending"
label = "Ascending (A to Z)"

[[settings.options]]
value = "descending"
label = "Descending (Z to A)"

[[settings]]
key = "auto_reveal"
kind = "bool"
default = true
title = "Auto Reveal Active File"
description = "Reveal and select the active document's file in the tree"

[[theme_tokens]]
key = "splitype.explorer.selection_accent"
description = "Accent bar color of the selected file-tree row"

[[commands]]
id = "rename"
shortcuts = ["f2"]
context = "ExplorerPanel"

[[commands]]
id = "delete"
shortcuts = ["delete"]
context = "ExplorerPanel"

[[commands]]
id = "trash"
shortcuts = []
context = "ExplorerPanel"

[[commands]]
id = "new-file"
shortcuts = ["alt-n"]
context = "ExplorerPanel"

[[commands]]
id = "new-directory"
shortcuts = ["alt-shift-n"]
context = "ExplorerPanel"

[[commands]]
id = "select-previous"
shortcuts = ["up"]
context = "ExplorerPanel"

[[commands]]
id = "select-next"
shortcuts = ["down"]
context = "ExplorerPanel"

[[commands]]
id = "select-parent"
shortcuts = ["alt-up"]
context = "ExplorerPanel"

[[commands]]
id = "select-first"
shortcuts = ["home"]
context = "ExplorerPanel"

[[commands]]
id = "select-last"
shortcuts = ["end"]
context = "ExplorerPanel"

[[commands]]
id = "expand-selected"
shortcuts = ["right"]
context = "ExplorerPanel"

[[commands]]
id = "collapse-selected"
shortcuts = ["left"]
context = "ExplorerPanel"

[[commands]]
id = "open-selected"
shortcuts = ["enter"]
context = "ExplorerPanel"

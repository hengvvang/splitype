# Splitype Editor panel plugin manifest.
manifest_version = 1
plugin = "splitype.editor"
name = "Editor"
version = "0.1.0"
description = "Document tab management, pane hosting, and Markdown workflows."

[entry]
kind = "in_process"
registration = "editor"

[capabilities]
panes = []
panels = ["splitype.panel.editor"]

# =============================================================================
# Commands Contribution Architecture (CommandGroup Tree)
# =============================================================================

[commands.persistence]
title = "File Persistence"
description = "Document saving and disk operations"
menu = "file"

[[commands.persistence.items]]
id = "save"
title = "Save Document"
description = "Save the active document to disk"
shortcuts = ["cmd-s", "ctrl-s"]

[[commands.persistence.items]]
id = "save-as"
title = "Save Document As..."
description = "Save the active document under a new file path"
shortcuts = ["cmd-shift-s", "ctrl-shift-s"]

[commands.export]
title = "Export Document"
description = "Export document to alternative formats"
menu = "file.export"

[[commands.export.items]]
id = "export-html"
title = "Export as HTML"
description = "Render and export the current document to standalone HTML"

[[commands.export.items]]
id = "export-pdf"
title = "Export as PDF"
description = "Render and print the current document to PDF format"

[commands.navigation]
title = "Scrolling & Navigation"
description = "Viewport scrolling and document cursor jumping"

[[commands.navigation.items]]
id = "page-up"
title = "Page Up"
description = "Scroll the viewport up by one page"
shortcuts = ["pageup"]

[[commands.navigation.items]]
id = "page-down"
title = "Page Down"
description = "Scroll the viewport down by one page"
shortcuts = ["pagedown"]

[[commands.navigation.items]]
id = "jump-to-top"
title = "Jump to Document Top"
description = "Move cursor and viewport to the beginning of document"
shortcuts = ["ctrl-home", "cmd-up"]

[[commands.navigation.items]]
id = "jump-to-bottom"
title = "Jump to Document Bottom"
description = "Move cursor and viewport to the end of document"
shortcuts = ["ctrl-end", "cmd-down"]

[[commands.navigation.items]]
id = "navigate-back"
title = "Navigate Back"
description = "Return to previous jump or link location"
shortcuts = ["alt-left"]

[[commands.navigation.items]]
id = "navigate-forward"
title = "Navigate Forward"
description = "Go forward to next jump or link location"
shortcuts = ["alt-right"]

[commands.layout]
title = "Pane & Workspace Layout"
description = "Switching and toggling editor panes"

[[commands.layout.items]]
id = "toggle-pane-kind"
title = "Toggle Editor Mode"
description = "Cycle active pane between WYSIWYG, Source Code, and Preview"
shortcuts = ["ctrl-tab", "cmd-tab"]

[[commands.layout.items]]
id = "toggle-maximize-pane"
title = "Toggle Maximize Pane"
description = "Maximize the active editor pane within the workspace"
shortcuts = ["ctrl-shift-m", "cmd-shift-m"]

[commands.search]
title = "Find & Replace"
description = "Document text search and replacement"

[[commands.search.items]]
id = "toggle-search"
title = "Find in Document"
description = "Open or close the document find bar"
shortcuts = ["cmd-f", "ctrl-f"]

[[commands.search.items]]
id = "toggle-replace"
title = "Replace in Document"
description = "Open or close the document replace bar"
shortcuts = ["cmd-h", "ctrl-h"]

[[commands.search.items]]
id = "find-next"
title = "Find Next Match"
description = "Jump to the next search occurrence"
shortcuts = ["f3"]

[[commands.search.items]]
id = "find-previous"
title = "Find Previous Match"
description = "Jump to the previous search occurrence"
shortcuts = ["shift-f3"]

# =============================================================================
# Settings Declaration
# Note: The `icon` field is an officially supported optional contract in the
# schema (accepts SVG paths such as "plugin://...").
# It is omitted here pending custom asset availability (deserialized as None via Serde).
# [IMPORTANT]: The `icon` field schema contract MUST be preserved and not removed!
# =============================================================================

[settings.status_bar]
category = "editor"
title = "Status Bar"
description = "Control visibility of the persistent bottom status bar across window"
# icon field preserved in schema; omitted pending asset availability
order = 1
default_collapsed = false

[[settings.status_bar.items]]
key = "status_bar_enabled"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Status Bar Visibility"
description = "Show or hide the persistent bottom status bar across window"

[settings.status_bar_metrics]
category = "editor"
title = "Document Metrics"
description = "Display real-time word count, cursor coordinates, and reading duration in status bar"
# icon field preserved in schema; omitted pending asset availability
order = 2
default_collapsed = false

[[settings.status_bar_metrics.items]]
key = "show_word_count"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Word Count Badge"
description = "Display real-time document word count in the status bar"

[[settings.status_bar_metrics.items]]
key = "show_cursor_position"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Cursor Position Badge"
description = "Display line and column coordinates in the status bar"

[[settings.status_bar_metrics.items]]
key = "show_character_count"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Character Count Badge"
description = "Display total character count in the status bar"

[[settings.status_bar_metrics.items]]
key = "show_reading_time"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = true
title = "Estimated Reading Time"
description = "Display estimated reading duration in the status bar"

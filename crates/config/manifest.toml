# Splitype core application plugin manifest: windows, files, preferences,
# and help commands shared by every window.
manifest_version = 1
plugin = "splitype.core"
name = "Core"
version = "0.1.0"
description = "Application window, file, preference, and help commands."

[entry]
kind = "in_process"
registration = "core"

[[commands]]
id = "about"
menu = "app"
shortcuts = []

[[commands]]
id = "check-updates"
menu = "app"
shortcuts = []

[[commands]]
id = "open-settings"
menu = "app"
shortcuts = []

[[commands]]
id = "quit"
menu = "app"
shortcuts = ["cmd-q"]

[[commands]]
id = "new-window"
menu = "file"
shortcuts = ["cmd-n", "ctrl-n"]

[[commands]]
id = "close-window"
menu = "file"
shortcuts = ["cmd-w", "ctrl-q"]

[[commands]]
id = "open-file"
menu = "file"
shortcuts = ["cmd-o", "ctrl-o"]

[[commands]]
id = "close-explorer-folder"
menu = "file"
shortcuts = []

[[commands]]
id = "toggle-explorer"
shortcuts = ["ctrl-w"]

[[commands]]
id = "toggle-maximize-area"
shortcuts = ["ctrl-space", "cmd-space"]

[[commands]]
id = "dismiss-transient-ui"
shortcuts = ["escape"]

[[commands]]
id = "copy"
shortcuts = ["cmd-c", "ctrl-c"]
context = "EditorContent"

[[commands]]
id = "cut"
shortcuts = ["cmd-x", "ctrl-x"]
context = "EditorContent"

[[commands]]
id = "paste"
shortcuts = ["cmd-v", "ctrl-v"]
context = "EditorContent"

[[commands]]
id = "select-all"
shortcuts = ["cmd-a", "ctrl-a"]
context = "EditorContent"

[[commands]]
id = "undo"
shortcuts = ["cmd-z", "ctrl-z"]
context = "EditorContent"

[[commands]]
id = "redo"
shortcuts = ["cmd-shift-z", "ctrl-y"]
context = "EditorContent"

[[commands]]
id = "repository"
menu = "help"
shortcuts = []

[[commands]]
id = "bug-report"
menu = "help"
shortcuts = []

[[commands]]
id = "feature-request"
menu = "help"
shortcuts = []

[[commands]]
id = "discussions"
menu = "help"
shortcuts = []

[[commands]]
id = "install-cli"
menu = "help"
shortcuts = []

[[commands]]
id = "uninstall-cli"
menu = "help"
shortcuts = []

[[setting_categories]]
id = "core.general"
title = "General"
order = 10

[[setting_categories]]
id = "core.appearance"
title = "Appearance"
order = 20

[[setting_categories]]
id = "core.color_overrides"
title = "Color Overrides"
order = 30

[[setting_categories]]
id = "core.typography"
title = "Typography"
order = 40

# =============================================================================
# Settings Declaration Architecture (WinUI 3 SettingsExpander Tree)
#
# Icon Field Specification & Configuration Guide:
# 1. The `icon` field is an officially supported, core optional contract in the
#    settings schema (`pub icon: Option<String>` in `SettingGroupDeclaration`
#    and `SettingDeclaration`).
# 2. It accepts SVG asset resource paths (e.g. "plugin://splitype.core/icon.svg").
# 3. When custom icon resources are not yet prepared or finalized, two syntaxes
#    are fully supported and functionally equivalent:
#    - [Explicit Empty String]: `icon = ""`
#    - [Field Omission]: Omit the `icon` key entirely (deserialized as None via Serde).
# 4. The UI rendering layer defensively sanitizes empty strings and whitespace,
#    seamlessly falling back to a clean text-first layout without blank placeholders
#    or asset load warnings.
# 5. [IMPORTANT]: The `icon` field schema contract MUST be preserved. Do NOT remove
#    the `icon` field definition or support from schemas or structs simply because
#    assets are pending.
# =============================================================================

# -----------------------------------------------------------------------------
# [Pattern 1: Explicit Empty String (`icon = ""`)]
# Demonstrates declaring the icon slot explicitly while resources are pending.
# -----------------------------------------------------------------------------
[settings.startup]
category = "core.general"
title = "Startup"
description = "Initial workspace and window restoration settings"
icon = "" # Explicit empty string: placeholder for pending icon asset
order = 1
default_collapsed = false

[[settings.startup.items]]
key = "startup.open"
icon = "" # Explicit empty string: placeholder for pending icon asset
kind = "enum"
default = "new_file"
title = "App Startup Behavior"
description = "Initial document or workspace opened upon launching Splitype"
options = [
  { value = "new_file", label = "Open New Document" },
  { value = "last_opened_file", label = "Open Last Active Document" },
]

[[settings.startup.items]]
key = "startup.restore_window_state"
icon = "" # Explicit empty string: placeholder for pending icon asset
kind = "bool"
default = true
title = "Restore Window Geometry & State"
description = "Remember previous window dimensions, position, and layout splits on startup"

# -----------------------------------------------------------------------------
# [Pattern 2: Omitted Icon Field]
# Demonstrates omitting `icon` to let Serde default to `None`.
# The schema contract remains intact; `icon = "plugin://..."` can be populated later.
# -----------------------------------------------------------------------------
[settings.language]
category = "core.general"
title = "Language"
description = "User interface language preferences"
# icon field preserved in schema; omitted pending asset availability
order = 2
default_collapsed = false

[[settings.language.items]]
key = "interface.language_id"
# icon field preserved in schema; omitted pending asset availability
kind = "language"
default = "en-US"
title = "Display Language"
description = "Select preferred language for editor UI and dialogs"

[settings.theme]
category = "core.appearance"
title = "Theme"
description = "Select theme appearance and visual palette"
# icon field preserved in schema; omitted pending asset availability
order = 1
default_collapsed = false

[[settings.theme.items]]
key = "theme.appearance"
# icon field preserved in schema; omitted pending asset availability
kind = "enum"
default = "dark"
title = "Theme Appearance"
description = "Light or dark appearance of the selected theme"
options = [
  { value = "dark", label = "Dark" },
  { value = "light", label = "Light" },
  { value = "auto", label = "Follow System" },
]

[[settings.theme.items]]
key = "theme.family"
# icon field preserved in schema; omitted pending asset availability
kind = "theme"
default = "splitype"
title = "Theme Family"
description = "Select the application-wide visual theme"

[settings.fonts]
category = "core.typography"
title = "Fonts"
description = "Interface, Markdown prose, and monospace code typography"
# icon field preserved in schema; omitted pending asset availability
order = 1
default_collapsed = false

[[settings.fonts.items]]
key = "typography.ui_font_family"
# icon field preserved in schema; omitted pending asset availability
kind = "font"
default = ""
title = "Interface Font"
description = "Font used for menus, file navigation panel, and application chrome"

[[settings.fonts.items]]
key = "typography.prose_font_family"
# icon field preserved in schema; omitted pending asset availability
kind = "font"
default = ""
title = "Prose Text Font"
description = "Font used for Markdown prose, headings, and tables"

[[settings.fonts.items]]
key = "typography.code_font_family"
# icon field preserved in schema; omitted pending asset availability
kind = "font"
default = ""
title = "Code Block Font"
description = "Monospace font used for code blocks and inline code"

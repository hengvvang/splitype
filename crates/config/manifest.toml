# Splitype core application plugin manifest: windows, files, preferences,
# and help commands shared by every window.
manifest_version = 1
plugin = "splitype.core"
name = "Core"
version = "0.1.0"
description = "Application window, file, preference, and help commands."

[entry]
kind = "in_process"
registration = "core"

# =============================================================================
# Commands Contribution Architecture (CommandGroup Tree)
#
# Commands are organized into functional groups with inherited context and menu
# locations, providing full metadata for menus, shortcuts, and command palette.
# =============================================================================

[commands.app]
title = "Application"
description = "Core application lifecycle and settings commands"
menu = "app"

[[commands.app.items]]
id = "about"
title = "About Splitype"
description = "Show version, build, and license information"

[[commands.app.items]]
id = "check-updates"
title = "Check for Updates"
description = "Check for newer application releases"

[[commands.app.items]]
id = "open-settings"
title = "Preferences"
description = "Open the settings dialog"

[[commands.app.items]]
id = "quit"
title = "Quit Splitype"
description = "Close all windows and exit the application"
shortcuts = ["cmd-q"]

[commands.window]
title = "Window Management"
description = "Application window lifecycle and layout commands"
menu = "file"

[[commands.window.items]]
id = "new-window"
title = "New Window"
description = "Open a new independent Splitype window"
shortcuts = ["cmd-n", "ctrl-n"]

[[commands.window.items]]
id = "close-window"
title = "Close Window"
description = "Close the current active window"
shortcuts = ["cmd-w", "ctrl-q"]

[commands.file]
title = "File Operations"
description = "Document opening and folder management"
menu = "file"

[[commands.file.items]]
id = "open-file"
title = "Open File"
description = "Open a document from disk"
shortcuts = ["cmd-o", "ctrl-o"]

[[commands.file.items]]
id = "close-explorer-folder"
title = "Close Workspace Folder"
description = "Close the current open folder in the explorer"

[commands.layout]
title = "Layout & UI"
description = "Workspace layout toggles and transient UI dismissals"

[[commands.layout.items]]
id = "toggle-explorer"
title = "Toggle Explorer Sidebar"
description = "Show or hide the explorer sidebar panel"
shortcuts = ["ctrl-w"]

[[commands.layout.items]]
id = "toggle-maximize-area"
title = "Toggle Maximize Editor Area"
description = "Maximize the editor area by collapsing panels"
shortcuts = ["ctrl-space", "cmd-space"]

[[commands.layout.items]]
id = "dismiss-transient-ui"
title = "Dismiss Transient UI"
description = "Dismiss open popovers, dropdowns, or overlays"
shortcuts = ["escape"]

[commands.clipboard]
title = "Clipboard"
description = "Standard clipboard cut, copy, and paste operations"
context = "EditorContent"

[[commands.clipboard.items]]
id = "copy"
title = "Copy"
description = "Copy selected text or blocks to clipboard"
shortcuts = ["cmd-c", "ctrl-c"]

[[commands.clipboard.items]]
id = "cut"
title = "Cut"
description = "Cut selected text or blocks to clipboard"
shortcuts = ["cmd-x", "ctrl-x"]

[[commands.clipboard.items]]
id = "paste"
title = "Paste"
description = "Paste content from clipboard"
shortcuts = ["cmd-v", "ctrl-v"]

[[commands.clipboard.items]]
id = "select-all"
title = "Select All"
description = "Select all document content"
shortcuts = ["cmd-a", "ctrl-a"]

[commands.history]
title = "History"
description = "Document undo and redo operations"
context = "EditorContent"

[[commands.history.items]]
id = "undo"
title = "Undo"
description = "Undo the last editing operation"
shortcuts = ["cmd-z", "ctrl-z"]

[[commands.history.items]]
id = "redo"
title = "Redo"
description = "Redo the previously undone operation"
shortcuts = ["cmd-shift-z", "ctrl-y"]

[commands.help]
title = "Help & Support"
description = "Documentation, feedback, and command-line tools"
menu = "help"

[[commands.help.items]]
id = "repository"
title = "GitHub Repository"
description = "Open the Splitype GitHub repository in default browser"

[[commands.help.items]]
id = "bug-report"
title = "Report a Bug"
description = "Submit a bug report on GitHub issues"

[[commands.help.items]]
id = "feature-request"
title = "Request a Feature"
description = "Submit a feature proposal on GitHub"

[[commands.help.items]]
id = "discussions"
title = "Community Discussions"
description = "Join community discussions on GitHub"

[[commands.help.items]]
id = "install-cli"
title = "Install Shell Command"
description = "Install the splitype CLI tool into system PATH"

[[commands.help.items]]
id = "uninstall-cli"
title = "Uninstall Shell Command"
description = "Remove the splitype CLI tool from system PATH"

[[setting_categories]]
id = "core.general"
title = "General"
order = 10

[[setting_categories]]
id = "core.appearance"
title = "Appearance"
order = 20

[[setting_categories]]
id = "core.color_overrides"
title = "Color Overrides"
order = 30

[[setting_categories]]
id = "core.typography"
title = "Typography"
order = 40

# =============================================================================
# Settings Declaration Architecture (WinUI 3 SettingsExpander Tree)
#
# Icon Field Specification & Configuration Guide:
# 1. The `icon` field is an officially supported, core optional contract in the
#    settings schema (`pub icon: Option<String>` in `SettingGroupDeclaration`
#    and `SettingDeclaration`).
# 2. It accepts SVG asset resource paths (e.g. "plugin://splitype.core/icon.svg").
# 3. When custom icon resources are not yet prepared or finalized, two syntaxes
#    are fully supported and functionally equivalent:
#    - [Explicit Empty String]: `icon = ""`
#    - [Field Omission]: Omit the `icon` key entirely (deserialized as None via Serde).
# 4. The UI rendering layer defensively sanitizes empty strings and whitespace,
#    seamlessly falling back to a clean text-first layout without blank placeholders
#    or asset load warnings.
# 5. [IMPORTANT]: The `icon` field schema contract MUST be preserved. Do NOT remove
#    the `icon` field definition or support from schemas or structs simply because
#    assets are pending.
# =============================================================================

# -----------------------------------------------------------------------------
# [Pattern 1: Explicit Empty String (`icon = ""`)]
# Demonstrates declaring the icon slot explicitly while resources are pending.
# -----------------------------------------------------------------------------
[settings.startup]
category = "core.general"
title = "Startup"
description = "Initial workspace and window restoration settings"
icon = "" # Explicit empty string: placeholder for pending icon asset
order = 1
default_collapsed = false

[[settings.startup.items]]
key = "startup.open"
icon = "" # Explicit empty string: placeholder for pending icon asset
kind = "enum"
default = "new_file"
title = "App Startup Behavior"
description = "Initial document or workspace opened upon launching Splitype"
options = [
  { value = "new_file", label = "Open New Document" },
  { value = "last_opened_file", label = "Open Last Active Document" },
]

[[settings.startup.items]]
key = "startup.restore_window_state"
icon = "" # Explicit empty string: placeholder for pending icon asset
kind = "bool"
default = true
title = "Restore Window Geometry & State"
description = "Remember previous window dimensions, position, and layout splits on startup"

# -----------------------------------------------------------------------------
# [Pattern 2: Omitted Icon Field]
# Demonstrates omitting `icon` to let Serde default to `None`.
# The schema contract remains intact; `icon = "plugin://..."` can be populated later.
# -----------------------------------------------------------------------------
[settings.language]
category = "core.general"
title = "Language"
description = "User interface language preferences"
# icon field preserved in schema; omitted pending asset availability
order = 2
default_collapsed = false

[[settings.language.items]]
key = "interface.language_id"
# icon field preserved in schema; omitted pending asset availability
kind = "language"
default = "en-US"
title = "Display Language"
description = "Select preferred language for editor UI and dialogs"

[settings.theme]
category = "core.appearance"
title = "Theme"
description = "Select theme appearance and visual palette"
# icon field preserved in schema; omitted pending asset availability
order = 1
default_collapsed = false

[[settings.theme.items]]
key = "theme.appearance"
# icon field preserved in schema; omitted pending asset availability
kind = "enum"
default = "dark"
title = "Theme Appearance"
description = "Light or dark appearance of the selected theme"
options = [
  { value = "dark", label = "Dark" },
  { value = "light", label = "Light" },
  { value = "auto", label = "Follow System" },
]

[[settings.theme.items]]
key = "theme.family"
# icon field preserved in schema; omitted pending asset availability
kind = "theme"
default = "splitype"
title = "Theme Family"
description = "Select the application-wide visual theme"

[settings.fonts]
category = "core.typography"
title = "Fonts"
description = "Interface, Markdown prose, and monospace code typography"
# icon field preserved in schema; omitted pending asset availability
order = 1
default_collapsed = false

[[settings.fonts.items]]
key = "typography.ui_font_family"
# icon field preserved in schema; omitted pending asset availability
kind = "font"
default = ""
title = "Interface Font"
description = "Font used for menus, file navigation panel, and application chrome"

[[settings.fonts.items]]
key = "typography.prose_font_family"
# icon field preserved in schema; omitted pending asset availability
kind = "font"
default = ""
title = "Prose Text Font"
description = "Font used for Markdown prose, headings, and tables"

[[settings.fonts.items]]
key = "typography.code_font_family"
# icon field preserved in schema; omitted pending asset availability
kind = "font"
default = ""
title = "Code Block Font"
description = "Monospace font used for code blocks and inline code"

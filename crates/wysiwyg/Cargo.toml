[package]
name = "wysiwyg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
gpui = { workspace = true }
theme = { path = "../theme" }
editor_contracts = { path = "../editor_contracts" }
platform_contracts = { path = "../platform_contracts" }
markdown_parser = { path = "../markdown_parser" }
syntax_highlighter = { path = "../syntax_highlighter" }
config = { path = "../config" }
ui = { path = "../ui" }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
unicode-segmentation = "1.13"
uuid = { workspace = true }
anyhow = { workspace = true }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tracing = "0.1"

[dev-dependencies]
toml = "1"


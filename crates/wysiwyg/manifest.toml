# Splitype WYSIWYG pane plugin manifest.
manifest_version = 1
plugin = "splitype.wysiwyg"
name = "WYSIWYG"
version = "0.1.0"
description = "Rich visual block editor pane with dual-direction text projection."

[entry]
kind = "in_process"
registration = "wysiwyg"

[capabilities]
panes = ["splitype.pane.wysiwyg"]
panels = []

# =============================================================================
# Commands Contribution Architecture (CommandGroup Tree)
# =============================================================================

[commands.editing]
title = "Text Editing"
description = "Character and word insertion and deletion"
context = "EditorContent"

[[commands.editing.items]]
id = "newline"
title = "Insert Line Break"
description = "Insert a newline or split the current block"
shortcuts = ["enter"]

[[commands.editing.items]]
id = "delete-backward"
title = "Delete Backward"
description = "Delete previous character or join with previous block"
shortcuts = ["backspace"]

[[commands.editing.items]]
id = "delete"
title = "Delete Forward"
description = "Delete next character or join with next block"
shortcuts = ["delete"]

[[commands.editing.items]]
id = "word-delete-backward"
title = "Delete Word Backward"
description = "Delete the previous whole word"
shortcuts = ["ctrl-backspace", "alt-backspace"]

[[commands.editing.items]]
id = "word-delete-forward"
title = "Delete Word Forward"
description = "Delete the next whole word"
shortcuts = ["ctrl-delete", "alt-delete"]

[commands.navigation]
title = "Cursor Navigation"
description = "Block and inline cursor movement"
context = "EditorContent"

[[commands.navigation.items]]
id = "focus-previous"
title = "Focus Previous Block"
description = "Move focus to the previous block"
shortcuts = ["up"]

[[commands.navigation.items]]
id = "focus-next"
title = "Focus Next Block"
description = "Move focus to the next block"
shortcuts = ["down"]

[[commands.navigation.items]]
id = "move-left"
title = "Move Left"
description = "Move cursor left by one character"
shortcuts = ["left"]

[[commands.navigation.items]]
id = "move-right"
title = "Move Right"
description = "Move cursor right by one character"
shortcuts = ["right"]

[[commands.navigation.items]]
id = "word-move-left"
title = "Move Word Backward"
description = "Move cursor backward by one word"
shortcuts = ["ctrl-left", "alt-left"]

[[commands.navigation.items]]
id = "word-move-right"
title = "Move Word Forward"
description = "Move cursor forward by one word"
shortcuts = ["ctrl-right", "alt-right"]

[[commands.navigation.items]]
id = "home"
title = "Move to Line Start"
description = "Move cursor to the start of current line"
shortcuts = ["home"]

[[commands.navigation.items]]
id = "end"
title = "Move to Line End"
description = "Move cursor to the end of current line"
shortcuts = ["end"]

[[commands.navigation.items]]
id = "block-up"
title = "Move Block Up"
description = "Move cursor or block upward"
shortcuts = ["ctrl-up", "alt-up"]

[[commands.navigation.items]]
id = "block-down"
title = "Move Block Down"
description = "Move cursor or block downward"
shortcuts = ["ctrl-down", "alt-down"]

[commands.selection]
title = "Text Selection"
description = "Inline character and word selection"
context = "EditorContent"

[[commands.selection.items]]
id = "select-left"
title = "Select Left"
description = "Extend selection left by one character"
shortcuts = ["shift-left"]

[[commands.selection.items]]
id = "select-right"
title = "Select Right"
description = "Extend selection right by one character"
shortcuts = ["shift-right"]

[[commands.selection.items]]
id = "word-select-left"
title = "Select Word Backward"
description = "Extend selection backward by one word"
shortcuts = ["ctrl-shift-left", "alt-shift-left"]

[[commands.selection.items]]
id = "word-select-right"
title = "Select Word Forward"
description = "Extend selection forward by one word"
shortcuts = ["ctrl-shift-right", "alt-shift-right"]

[[commands.selection.items]]
id = "select-home"
title = "Select to Line Start"
description = "Extend selection to the beginning of current line"
shortcuts = ["shift-home"]

[[commands.selection.items]]
id = "select-end"
title = "Select to Line End"
description = "Extend selection to the end of current line"
shortcuts = ["shift-end"]

[commands.formatting]
title = "Inline Formatting"
description = "Markdown inline styling and formatting"
context = "EditorContent"

[[commands.formatting.items]]
id = "bold-selection"
title = "Toggle Bold"
description = "Apply or remove bold formatting on selection"
shortcuts = ["cmd-b", "ctrl-b"]

[[commands.formatting.items]]
id = "italic-selection"
title = "Toggle Italic"
description = "Apply or remove italic formatting on selection"
shortcuts = ["cmd-i", "ctrl-i"]

[[commands.formatting.items]]
id = "underline-selection"
title = "Toggle Underline"
description = "Apply or remove underline formatting on selection"
shortcuts = ["cmd-u", "ctrl-u"]

[[commands.formatting.items]]
id = "code-selection"
title = "Toggle Inline Code"
description = "Apply or remove inline code formatting on selection"
shortcuts = ["cmd-`", "ctrl-`"]

[[commands.formatting.items]]
id = "strikethrough-selection"
title = "Toggle Strikethrough"
description = "Apply or remove strikethrough formatting on selection"
shortcuts = ["cmd-shift-x", "ctrl-shift-x", "alt-shift-5"]

[commands.structure]
title = "Block Structure"
description = "Block indentation, nesting, and breakout operations"
context = "EditorContent"

[[commands.structure.items]]
id = "indent-block"
title = "Indent Block"
description = "Increase block nesting or tab indentation"
shortcuts = ["tab"]

[[commands.structure.items]]
id = "outdent-block"
title = "Outdent Block"
description = "Decrease block nesting or tab indentation"
shortcuts = ["shift-tab"]

[[commands.structure.items]]
id = "exit-code-block"
title = "Exit Code Block"
description = "Break out of a code block to a new paragraph"
shortcuts = ["cmd-enter", "ctrl-enter"]

# =============================================================================
# Settings Declaration
# Note: The `icon` field is an officially supported optional contract in the
# schema (accepts SVG paths such as "plugin://...").
# It is omitted here pending custom asset availability (deserialized as None via Serde).
# [IMPORTANT]: The `icon` field schema contract MUST be preserved and not removed!
# =============================================================================

[settings.clipboard]
category = "wysiwyg"
title = "Clipboard & Assets"
description = "Storage destination and path strategy when pasting images from clipboard"
# icon field preserved in schema; omitted pending asset availability
order = 1
default_collapsed = false

[[settings.clipboard.items]]
key = "image_paste_behavior"
# icon field preserved in schema; omitted pending asset availability
kind = "enum"
default = "none"
title = "Clipboard Image Paste Action"
description = "Storage destination and path strategy when pasting images from clipboard"
options = [
  { value = "none", label = "No local copy (standard insertion)" },
  { value = "copy_to_document_folder", label = "Copy image to document folder (./)" },
  { value = "copy_to_assets_folder", label = "Copy image to assets folder (./assets/)" },
  { value = "copy_to_named_assets_folder", label = "Copy image to named assets folder (./.assets/)" },
]

[settings.code_blocks]
category = "wysiwyg"
title = "Code Blocks"
description = "Code block display and gutter line numbers"
# icon field preserved in schema; omitted pending asset availability
order = 2
default_collapsed = false

[[settings.code_blocks.items]]
key = "show_code_line_numbers"
# icon field preserved in schema; omitted pending asset availability
kind = "bool"
default = false
title = "Show Line Numbers"
description = "Display line numbers in code blocks"


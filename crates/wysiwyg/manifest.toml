# Splitype WYSIWYG pane plugin manifest.
manifest_version = 1
plugin = "splitype.wysiwyg"
name = "WYSIWYG"
version = "0.1.0"
description = "Rich visual block editor pane with dual-direction text projection."

[entry]
kind = "in_process"
registration = "wysiwyg"

[capabilities]
panes = ["splitype.pane.wysiwyg"]
panels = []

[[commands]]
id = "newline"
shortcuts = ["enter"]
context = "EditorContent"

[[commands]]
id = "delete-backward"
shortcuts = ["backspace"]
context = "EditorContent"

[[commands]]
id = "delete"
shortcuts = ["delete"]
context = "EditorContent"

[[commands]]
id = "word-delete-backward"
shortcuts = ["ctrl-backspace", "alt-backspace"]
context = "EditorContent"

[[commands]]
id = "word-delete-forward"
shortcuts = ["ctrl-delete", "alt-delete"]
context = "EditorContent"

[[commands]]
id = "focus-previous"
shortcuts = ["up"]
context = "EditorContent"

[[commands]]
id = "focus-next"
shortcuts = ["down"]
context = "EditorContent"

[[commands]]
id = "move-left"
shortcuts = ["left"]
context = "EditorContent"

[[commands]]
id = "move-right"
shortcuts = ["right"]
context = "EditorContent"

[[commands]]
id = "word-move-left"
shortcuts = ["ctrl-left", "alt-left"]
context = "EditorContent"

[[commands]]
id = "word-move-right"
shortcuts = ["ctrl-right", "alt-right"]
context = "EditorContent"

[[commands]]
id = "home"
shortcuts = ["home"]
context = "EditorContent"

[[commands]]
id = "end"
shortcuts = ["end"]
context = "EditorContent"

[[commands]]
id = "block-up"
shortcuts = ["ctrl-up", "alt-up"]
context = "EditorContent"

[[commands]]
id = "block-down"
shortcuts = ["ctrl-down", "alt-down"]
context = "EditorContent"

[[commands]]
id = "select-left"
shortcuts = ["shift-left"]
context = "EditorContent"

[[commands]]
id = "select-right"
shortcuts = ["shift-right"]
context = "EditorContent"

[[commands]]
id = "word-select-left"
shortcuts = ["ctrl-shift-left", "alt-shift-left"]
context = "EditorContent"

[[commands]]
id = "word-select-right"
shortcuts = ["ctrl-shift-right", "alt-shift-right"]
context = "EditorContent"

[[commands]]
id = "select-home"
shortcuts = ["shift-home"]
context = "EditorContent"

[[commands]]
id = "select-end"
shortcuts = ["shift-end"]
context = "EditorContent"

[[commands]]
id = "bold-selection"
shortcuts = ["cmd-b", "ctrl-b"]
context = "EditorContent"

[[commands]]
id = "italic-selection"
shortcuts = ["cmd-i", "ctrl-i"]
context = "EditorContent"

[[commands]]
id = "underline-selection"
shortcuts = ["cmd-u", "ctrl-u"]
context = "EditorContent"

[[commands]]
id = "code-selection"
shortcuts = ["cmd-`", "ctrl-`"]
context = "EditorContent"

[[commands]]
id = "strikethrough-selection"
shortcuts = ["cmd-shift-x", "ctrl-shift-x", "alt-shift-5"]
context = "EditorContent"

[[commands]]
id = "indent-block"
shortcuts = ["tab"]
context = "EditorContent"

[[commands]]
id = "outdent-block"
shortcuts = ["shift-tab"]
context = "EditorContent"

[[commands]]
id = "exit-code-block"
shortcuts = ["cmd-enter", "ctrl-enter"]
context = "EditorContent"

[[settings]]
key = "image_paste_behavior"
kind = "enum"
default = "none"
title = "Clipboard Image Paste Action"
description = "Storage destination and path strategy when pasting images from clipboard"

[[settings.options]]
value = "none"
label = "No local copy (standard insertion)"

[[settings.options]]
value = "copy_to_document_folder"
label = "Copy image to document folder (./)"

[[settings.options]]
value = "copy_to_assets_folder"
label = "Copy image to assets folder (./assets/)"

[[settings.options]]
value = "copy_to_named_assets_folder"
label = "Copy image to named assets folder (./.assets/)"

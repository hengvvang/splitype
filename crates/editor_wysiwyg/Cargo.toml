[package]
name = "editor_wysiwyg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/wysiwyg.rs"

[features]
default = ["html-native", "code-highlight-core"]
html-native = []
code-highlight-core = [
    "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-c-sharp", "tree-sitter-css",
    "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript",
    "tree-sitter-json", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-typescript",
    "tree-sitter-yaml",
]
code-highlight-official = ["code-highlight-core"]
code-highlight-config = ["code-highlight-core"]

[lints]
workspace = true

[dependencies]
gpui = { workspace = true }
primitives = { path = "../primitives" }
theme = { path = "../theme" }
editor_model = { path = "../editor_model" }
workspace = { path = "../workspace" }
config = { path = "../config" }
i18n = { path = "../i18n" }
ui = { path = "../ui" }
url = "2"
unicode-segmentation = "1.13"
regex = "1.10"
uuid = { workspace = true }
serde = { workspace = true }
taffy = "0.7"
smallvec = { version = "1", features = ["serde"] }
cssparser = "0.37"
ratex-parser = "0.1.13"
ratex-layout = "0.1.13"
ratex-svg = "0.1.13"
directories = "6"
anyhow = { workspace = true }
mermaid-rs-renderer = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
chromiumoxide = { version = "0.9.1", default-features = false, features = ["bytes"] }
tokio = { workspace = true }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
thiserror = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-html = { workspace = true, optional = true }
tree-sitter-highlight = "0.26.9"
lazy_static = "1.5"

# Code-block syntax highlighting languages (self-hosted, D14-B).
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }

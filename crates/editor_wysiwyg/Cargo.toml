[package]
name = "editor_wysiwyg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/wysiwyg.rs"

[lints]
workspace = true

[dependencies]
gpui = { workspace = true }
theme = { path = "../theme" }
editor_model = { path = "../editor_model" }
editor_outline = { path = "../editor_outline" }
editor_search = { path = "../editor_search" }
markdown_ast_parser = { path = "../markdown_ast_parser" }
syntax_highlighter = { path = "../syntax_highlighter" }
workspace = { path = "../workspace" }
config = { path = "../config" }
ui = { path = "../ui" }
url = "2"
unicode-segmentation = "1.13"
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
chromiumoxide = { version = "0.9.1", default-features = false, features = ["bytes"] }
tokio = { workspace = true }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tracing = "0.1"

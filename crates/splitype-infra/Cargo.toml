[package]
name = "splitype-infra"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
directories = "6"
futures = "0.3"
gpui = { version = "0.2.2" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
toml = "1"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
uuid = "1.23"

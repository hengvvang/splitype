[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "app"

[lints]
workspace = true

[features]
default = []

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
splitter = { path = "../splitter" }
theme = { path = "../theme" }
config = { path = "../config" }
splitype_installer = { path = "../splitype_installer" }
ui = { path = "../ui" }
explorer_fs = { path = "../explorer_fs" }
workspace = { path = "../workspace" }
core_contracts = { path = "../core_contracts" }
editor = { path = "../editor" }
pane_wysiwyg = { path = "../pane_wysiwyg" }
pane_source_code = { path = "../pane_source_code" }
pane_preview = { path = "../pane_preview" }
settings = { path = "../settings" }
syntax_highlighter = { path = "../syntax_highlighter" }
splitype_cli = { path = "../splitype_cli" }
explorer = { path = "../explorer" }

gpui = { workspace = true }
gpui_platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
regex = "1.10"
notify = "8"
futures = "0.3"
uuid = { workspace = true }
schemars = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3"
[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "app"

[lints]
workspace = true

[features]
default = ["editor_wysiwyg/html-native", "code-highlight-core"]
code-highlight-core = ["editor_wysiwyg/code-highlight-core"]

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
splitter = { path = "../splitter" }
theme = { path = "../theme" }
config = { path = "../config" }
splitype_installer = { path = "../splitype_installer" }
ui = { path = "../ui" }
explorer_fs = { path = "../explorer_fs" }
workspace = { path = "../workspace" }
editor_model = { path = "../editor_model" }
editor_core = { path = "../editor_core" }
editor_builder = { path = "../editor_builder" }
editor_source_code = { path = "../editor_source_code" }
editor_search = { path = "../editor_search" }
editor_outline = { path = "../editor_outline" }
editor_wysiwyg = { path = "../editor_wysiwyg" }
editor_preview = { path = "../editor_preview" }
settings = { path = "../settings" }
splitype_cli = { path = "../splitype_cli" }
explorer = { path = "../explorer" }

gpui = { workspace = true }
gpui_platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
unicode-segmentation = "1.13"
regex = "1.10"
notify = "8"
futures = "0.3"
uuid = { workspace = true }
schemars = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3"
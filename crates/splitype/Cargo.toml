[package]
name = "splitype"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "splitype"

[lints]
workspace = true

[features]
default = ["syntax/default", "markdown/default"]
code-highlight-core = ["syntax/code-highlight-core"]

[[bin]]
name = "splitype"
path = "src/main.rs"

[dependencies]
primitives = { path = "../primitives" }
sum_tree = { path = "../sum_tree" }
markdown = { path = "../markdown" }
splitter = { path = "../splitter" }
theme = { path = "../theme" }
i18n = { path = "../i18n" }
config = { path = "../config" }
net = { path = "../net" }
syntax = { path = "../syntax" }
latex = { path = "../latex" }
mermaid = { path = "../mermaid" }
export = { path = "../export" }
ui = { path = "../ui" }
explorer_fs = { path = "../explorer_fs" }
workspace = { path = "../workspace" }
editor_core = { package = "editor", path = "../editor" }
editor_source_code = { path = "../editor_source_code" }
settings = { path = "../settings" }
explorer = { path = "../explorer" }

gpui = { workspace = true }
gpui_platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
unicode-segmentation = "1.13"
regex = "1.10"
notify = "8"
futures = "0.3"
uuid = { workspace = true }
schemars = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3"

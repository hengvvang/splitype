[package]
name = "pane_wysiwyg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/wysiwyg.rs"

[lints]
workspace = true

[dependencies]
gpui = { workspace = true }
theme = { path = "../theme" }
core_contracts = { path = "../core_contracts" }
markdown_parser = { path = "../markdown_parser" }
syntax_highlighter = { path = "../syntax_highlighter" }
window = { path = "../window" }
config = { path = "../config" }
ui = { path = "../ui" }
url = "2"
unicode-segmentation = "1.13"
uuid = { workspace = true }
anyhow = { workspace = true }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tracing = "0.1"

